
name: NEARUSDT Telegram Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check NEARUSDT and send Telegram alert
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.parse, statistics

          BOT_TOKEN = os.environ["BOT_TOKEN"]
          CHAT_ID = os.environ["CHAT_ID"]

          def get_json(url):
              req = urllib.request.Request(url, headers={"User-Agent": "NEAR-alerts/1.0"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode())

          url = "https://api.bybit.com/v5/market/kline?category=linear&symbol=NEARUSDT&interval=15&limit=100"
          data = get_json(url)
          if data.get("retCode") != 0:
              raise RuntimeError("Bybit API error: " + str(data.get("retMsg")))

          candles = sorted(data["result"]["list"], key=lambda x: int(x[0]))
          # Exclude the currently forming 15-minute candle.
          candles = [c for c in candles if int(c[0]) + 15 * 60 * 1000 <= int(__import__("time").time() * 1000)]
          if len(candles) < 60:
              raise RuntimeError("Not enough closed candles")

          closes = [float(c[4]) for c in candles]
          highs = [float(c[2]) for c in candles]
          lows = [float(c[3]) for c in candles]
          last = closes[-1]

          def ema(values, period):
              k = 2 / (period + 1)
              out = values[0]
              for v in values[1:]:
                  out = v * k + out * (1 - k)
              return out

          def rsi(values, period=14):
              changes = [values[i] - values[i-1] for i in range(1, len(values))]
              gains = [max(x, 0) for x in changes[-period:]]
              losses = [max(-x, 0) for x in changes[-period:]]
              avg_gain = sum(gains) / period
              avg_loss = sum(losses) / period
              if avg_loss == 0:
                  return 100.0
              return 100 - 100 / (1 + avg_gain / avg_loss)

          e20, e50 = ema(closes[-80:], 20), ema(closes[-80:], 50)
          r = rsi(closes)
          recent_high = max(highs[-20:])
          recent_low = min(lows[-20:])

          # Conservative educational setup: trend + RSI + breakout of recent range.
          signal = None
          if last > e20 > e50 and 52 <= r <= 68 and last > recent_high * 0.999:
              signal = "LONG"
          elif last < e20 < e50 and 32 <= r <= 48 and last < recent_low * 1.001:
              signal = "SHORT"

          if signal:
              msg = (
                  f"NEARUSDT {signal} — проверка сигнала\\n"
                  f"Цена: {last:.4f}\\nRSI(14): {r:.1f}\\n"
                  f"EMA20: {e20:.4f}\\nEMA50: {e50:.4f}\\n"
                  f"Уровни последних 20 свечей: {recent_low:.4f}–{recent_high:.4f}\\n"
                  "Это уведомление, не гарантия входа. Проверь график и комиссию перед сделкой."
              )
              tg = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage"
              body = urllib.parse.urlencode({"chat_id": CHAT_ID, "text": msg}).encode()
              req = urllib.request.Request(tg, data=body)
              with urllib.request.urlopen(req, timeout=20) as response:
                  print(response.read().decode())
          else:
              print(f"No signal. Price={last:.4f}, RSI={r:.1f}, EMA20={e20:.4f}, EMA50={e50:.4f}")
          PY
